# Kyrius em producao: aplicacao + banco, prontos para uma VPS.
#
# Subir:      docker compose -f docker-compose.prod.yml up -d --build
# Migrar:     docker compose -f docker-compose.prod.yml exec app npx prisma migrate deploy
# Logs:       docker compose -f docker-compose.prod.yml logs -f app
# Derrubar:   docker compose -f docker-compose.prod.yml down
#
# ⚠️ ESTE ARQUIVO NAO USA `${VARIAVEL}` DE PROPOSITO.
#
# O Compose interpola `${...}` lendo o `.env` da pasta — e faz isso ANTES de
# entregar qualquer coisa ao container. Como algumas credenciais contem `$`
# (a chave do Asaas comeca com `$aact_`), o Compose lia o trecho depois do
# cifrao como nome de variavel, nao encontrava, e substituia por vazio: a
# chave chegaria corrompida no container e a integracao quebraria em silencio.
# O mesmo defeito impedia ate `docker compose down` de rodar.
#
# Sem interpolacao, o `env_file` entrega o arquivo ao container byte a byte.
# Configure tudo — inclusive POSTGRES_* e DATABASE_URL — no `.env`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Le POSTGRES_USER, POSTGRES_PASSWORD e POSTGRES_DB direto do arquivo.
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Backups gravados pelo script ficam acessiveis do host.
      - ./backups:/backups
    healthcheck:
      # `$$` escapa o cifrao para o Compose nao tentar interpolar aqui.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem `ports`: o banco so e alcancavel pela rede interna do compose.
    # Expor 5432 na internet e um dos erros mais comuns e mais caros.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      # Publique atras de um proxy reverso com TLS (Caddy, Nginx, Traefik).
      # Trocar por "127.0.0.1:3000:3000" deixa a app acessivel apenas ao proxy.
      - '3000:3000'

volumes:
  postgres-data:
